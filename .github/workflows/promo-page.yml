# iskill-promo-page · 默认部署方式（GitHub Actions 产物）
#
# 把 <repo>/promo-page/ 整个目录作为静态站点发布。
# 与 promo-page-branch.yml 二选一，别同时开。
#
# ⚠️ 首次使用需在仓库 Settings → Pages → Build and deployment
#    把 Source 设为 "GitHub Actions"，否则本工作流会报 pages 未启用。

name: promo-page

on:
  push:
    branches: [main]
    paths:
      - "promo-page/**"
      - ".github/workflows/promo-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: promo-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 冒烟检查（首页与资源都在）
        run: |
          set -e
          test -f promo-page/index.html || { echo "缺少 promo-page/index.html"; exit 1; }
          test -f promo-page/assets/style.css || { echo "缺少 assets/style.css"; exit 1; }
          grep -q "assets/content.js" promo-page/index.html || { echo "index.html 未引用 content.js"; exit 1; }
          echo "OK：promo-page 结构完整"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: promo-page

      - id: deployment
        uses: actions/deploy-pages@v4
